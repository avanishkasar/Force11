[build]
builder = "NIXPACKS"
buildCommand = "npm --prefix frontend ci --omit=optional --no-audit --no-fund && npm --prefix frontend run build"

[deploy]
startCommand = "npm --prefix frontend run preview -- --host 0.0.0.0 --port ${PORT}"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
